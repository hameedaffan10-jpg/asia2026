<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>Thailand Vietnam China 2026</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#22503F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TH VN CN 2026">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;700;800&family=Nunito:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: phone-first app shell. Jade header with gold waves, a vertical journey line with one station per day, paper cards, fixed tab bar. Rice paper, jade, moss, temple gold, cinnabar. */
:root{
  --bg:#F7F1E5; --surface:#FFFCF5; --sunk:#EFE7D7; --ink:#2E2A22; --muted:#7F7666; --line:#E5DAC6;
  --jade:#2F6B55; --jade-deep:#22503F; --jade-soft:#DDEBDF; --moss:#7E9A55; --gold:#C4963A; --lacquer:#B4452F;
  --on-jade:#FBF5E8; --good:#2F6B55; --warn:#B4452F; --warn-bg:#FAE6DC;
  --sea:#DCEAE6; --land:#EEE5D2; --land-trip:#D5E4CF; --border:#FFFCF5; --route:#B4452F;
  --urban:#EADBBE; --river:#93C1B9; --road:#FFFCF5; --road-major:#E0B45E; --tilefilter:sepia(.18) saturate(.85);
  --shadow:0 1px 2px rgba(70,55,30,.06),0 6px 18px rgba(70,55,30,.07);
  --display:"Shippori Mincho","Songti SC",Georgia,serif;
  --body:"Nunito",-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"DM Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#171A16; --surface:#21251F; --sunk:#2A2F27; --ink:#EEE8DA; --muted:#A9A391; --line:#343A31;
  --jade:#7CC2A2; --jade-deep:#1F3D32; --jade-soft:#26392F; --moss:#A6C27B; --gold:#E2B864; --lacquer:#E58A70;
  --on-jade:#F5EEDD; --good:#6FB896; --warn:#EE9479; --warn-bg:#3A2620;
  --sea:#1A2421; --land:#2B2D26; --land-trip:#2F4A3C; --border:#171A16; --route:#E58A70; --urban:#4A4433; --river:#3F6E68; --road:#5A5F50; --road-major:#A5864A; --tilefilter:invert(.9) hue-rotate(180deg) saturate(.55) brightness(.95);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#171A16; --surface:#21251F; --sunk:#2A2F27; --ink:#EEE8DA; --muted:#A9A391; --line:#343A31;
  --jade:#7CC2A2; --jade-deep:#1F3D32; --jade-soft:#26392F; --moss:#A6C27B; --gold:#E2B864; --lacquer:#E58A70;
  --on-jade:#F5EEDD; --good:#6FB896; --warn:#EE9479; --warn-bg:#3A2620;
  --sea:#1A2421; --land:#2B2D26; --land-trip:#2F4A3C; --border:#171A16; --route:#E58A70; --urban:#4A4433; --river:#3F6E68; --road:#5A5F50; --road-major:#A5864A; --tilefilter:invert(.9) hue-rotate(180deg) saturate(.55) brightness(.95);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--jade-deep)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--jade);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:14px}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;color:var(--on-jade);background-color:var(--jade-deep);
  background-image:radial-gradient(circle at 50% 100%,transparent 9px,rgba(226,184,100,.16) 10px,transparent 11px,transparent 15px,rgba(226,184,100,.16) 16px,transparent 17px);
  background-size:36px 18px;border-radius:0 0 22px 22px;box-shadow:0 4px 14px rgba(20,50,40,.2)}
.top-in{max-width:640px;margin:0 auto;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-block:14px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.top h1{margin:0;font-family:var(--display);font-weight:800;font-size:22px;line-height:1.15;text-wrap:balance}
.top h1 span{color:var(--gold)}
.top .sub{font-size:13px;opacity:.85;margin-top:2px}
.top .badge{background:var(--gold);color:#2E2A22;font-weight:800;font-size:13px;padding:5px 11px;border-radius:999px;white-space:nowrap}

main{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px calc(100px + env(safe-area-inset-bottom,0px))}
section.view{display:flex;flex-direction:column;gap:16px}
h2.sec{margin:6px 0 0;font-family:var(--display);font-weight:800;font-size:22px;text-wrap:balance}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);box-shadow:0 -4px 18px rgba(50,60,40,.09);border-radius:22px 22px 0 0;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
.tabs button{background:none;border:0;padding:10px 2px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:800;color:var(--muted)}
.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current="page"]{color:var(--jade)}
.tabs button[aria-current="page"] svg{fill:var(--jade-soft)}

/* ---- Route overview ---- */
.overview{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);display:grid;grid-template-columns:minmax(0,48%) 1fr;overflow:hidden}
.overview svg{display:block;width:100%;height:100%;min-height:250px;background:var(--sea)}
.overview ol{list-style:none;margin:0;padding:14px 14px 14px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.overview li button{width:100%;text-align:left;background:none;border:0;border-radius:10px;padding:5px 6px;display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:center}
.overview li button:hover{background:var(--sunk)}
.overview .n{width:22px;height:22px;border-radius:50%;background:var(--c);color:#fff;font-size:12px;font-weight:800;display:grid;place-items:center}
.overview .nm{font-weight:800;font-size:15px;line-height:1.2}
.overview .nm .loc{font-weight:600;color:var(--gold);font-size:12px}
.overview .nm small{display:block;font-weight:600;color:var(--muted);font-size:12px}
.overview .nt{font-family:var(--mono);font-size:12px;color:var(--muted)}
.overview .head{font-family:var(--display);font-weight:800;font-size:18px;padding:0 6px 6px}

/* ---- Day picker: postcard grid ---- */
.daygrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.daygrid .ghead{grid-column:1/-1;display:flex;align-items:baseline;gap:10px;margin-top:8px;border-bottom:1.5px solid var(--line);padding-bottom:6px}
.daygrid .ghead b{font-family:var(--display);font-weight:800;font-size:19px;color:var(--c)}
.daygrid .ghead span{font-family:var(--display);color:var(--muted)}
.pc{position:relative;display:flex;flex-direction:column;text-align:left;border:0;padding:0;background:var(--surface);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;transition:transform .15s ease,box-shadow .15s ease}
.pc:hover{transform:translateY(-2px);box-shadow:0 2px 4px rgba(70,55,30,.08),0 12px 26px rgba(70,55,30,.12)}
.pc:active{transform:scale(.98)}
.pc .thumb{position:relative;aspect-ratio:16/11;background:var(--sea);overflow:hidden}
.pc .thumb svg{position:absolute;inset:0;width:100%;height:100%}
.pc .stamp{position:absolute;top:8px;left:8px;background:var(--surface);border-radius:12px;padding:4px 9px 5px;display:flex;flex-direction:column;align-items:center;line-height:1;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.pc .stamp b{font-family:var(--display);font-weight:800;font-size:22px}
.pc .stamp small{font-size:10px;font-weight:800;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;margin-top:2px}
.pc .nowtag{position:absolute;top:8px;right:8px;background:var(--lacquer);color:#fff;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:800;letter-spacing:.04em}
.pc .cap{padding:10px 12px 12px;border-top:4px solid var(--c);display:flex;flex-direction:column;gap:1px}
.pc .cap .c{font-family:var(--display);font-weight:800;font-size:18px;line-height:1.15}
.pc .cap .c span{color:var(--gold);font-size:13px;margin-left:5px}
.pc .cap .s{font-size:12.5px;color:var(--muted);font-weight:600;line-height:1.35}
.pc .travel{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--jade-deep);
  background:repeating-linear-gradient(135deg,var(--jade-soft) 0 10px,var(--sunk) 10px 20px)}
.pc .travel svg{position:static;width:30px;height:30px;stroke:var(--jade);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.pc .travel b{font-family:var(--mono);font-size:12px;font-weight:500;color:var(--ink);background:var(--surface);padding:2px 8px;border-radius:999px}
.pc.wide{grid-column:1/-1}
.pc.wide .thumb{aspect-ratio:16/7}
.pc.done-day .cap .c::after{content:" ✓";color:var(--jade)}

/* ---- Day page ---- */
.daybar{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hh,76px));z-index:4;margin-inline:-6px;display:grid;grid-template-columns:auto 1fr auto auto;gap:8px;align-items:center;padding:8px 6px;background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-radius:0 0 16px 16px}
.daybar .back{border:0;background:var(--surface);box-shadow:var(--shadow);border-radius:999px;padding:7px 14px 7px 10px;font-weight:800;font-size:14px;display:flex;align-items:center;gap:4px}
.daybar .pos{text-align:center;font-size:13px;font-weight:800;color:var(--muted)}
.daybar .nav{border:0;background:var(--surface);box-shadow:var(--shadow);border-radius:50%;width:38px;height:38px;display:grid;place-items:center}
.daybar .nav[disabled]{opacity:.35}
.daybar svg,.back svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.dropping .daybar .nav:not([disabled]),.dropping .pager button:not([disabled]){outline:2.5px dashed var(--jade);outline-offset:2px}
[data-dropday].over{background:var(--jade)!important;color:var(--on-jade)!important;transform:scale(1.08)}

.hero{position:relative;border-radius:22px;overflow:hidden;box-shadow:var(--shadow);background:var(--sea)}
.hero svg{display:block;width:100%;height:auto;aspect-ratio:16/10}
.hero .attr{position:absolute;right:8px;top:6px;font-size:9.5px;color:var(--muted);background:color-mix(in srgb,var(--surface) 80%,transparent);padding:1px 6px;border-radius:6px}
.hero .open{position:absolute;right:10px;bottom:10px;background:var(--jade);color:var(--on-jade);border-radius:999px;padding:6px 13px;font-weight:800;font-size:13px;text-decoration:none;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.hero .legend{position:absolute;left:10px;bottom:10px;display:flex;gap:6px;flex-wrap:wrap;max-width:60%}
.hero .legend > span{background:var(--surface);border-radius:999px;padding:3px 9px;font-size:12px;font-weight:800;box-shadow:0 2px 6px rgba(0,0,0,.1)}
.dtitle{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.dtitle .city{font-family:var(--display);font-weight:800;font-size:38px;line-height:1.05}
.dtitle .city span{font-size:20px;color:var(--gold);margin-left:8px}
.dtitle .date{font-size:15px;color:var(--muted);font-weight:700;margin-top:2px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip2{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;padding:4px 10px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.chip2 i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.legcard{display:flex;gap:12px;align-items:center;background:var(--jade-soft);border-radius:16px;padding:12px 14px}
.legcard .ico{flex:0 0 auto;width:38px;height:38px;border-radius:50%;background:var(--surface);display:grid;place-items:center}
.legcard .ico svg{width:19px;height:19px;stroke:var(--jade);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.legcard b{font-family:var(--mono);font-weight:500;font-size:14px;display:block}
.legcard span{font-size:13px;color:var(--muted);font-weight:600}
.pnum{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--lacquer);color:#fff;font-size:11px;font-weight:800;margin-right:6px;vertical-align:2px;font-family:var(--body)}
.pnum.h{background:var(--jade)}
.row.flash{animation:flash 1.2s ease}
@keyframes flash{0%,40%{background:var(--jade-soft)}100%{background:var(--surface)}}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pager button{border:0;background:var(--surface);box-shadow:var(--shadow);border-radius:16px;padding:12px 14px;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0}
.pager button.r{text-align:right;align-items:flex-end}
.pager button[disabled]{visibility:hidden}
.pager small{font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.04em}
.pager b{font-family:var(--display);font-size:17px}

/* ---- Map styling ---- */
svg .sea{fill:var(--sea)} svg .landO{fill:var(--land);stroke:var(--border);stroke-width:.8} svg .landT{fill:var(--land-trip);stroke:var(--border);stroke-width:1}
svg .route{fill:none;stroke:var(--route);stroke-width:1.6;stroke-dasharray:4 4;vector-effect:non-scaling-stroke;opacity:.8}
svg .badge-c{fill:var(--surface);stroke:var(--c);stroke-width:2.5;vector-effect:non-scaling-stroke;filter:drop-shadow(0 1px 2px rgba(0,0,0,.18))}
svg .badge-i path,svg .badge-i rect{fill:none;stroke:var(--c);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.cicon{flex:0 0 auto;fill:none;stroke:var(--c);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
.cicon *{fill:none}
.cicon .neon,svg .badge-i .neon{stroke:var(--gold);stroke-width:2}
svg .ndot{stroke:var(--surface);stroke-width:2;vector-effect:non-scaling-stroke} svg .ntxt{fill:#fff;font:800 28px var(--body);text-anchor:middle;dominant-baseline:central}
.dm .ml{fill:var(--land-trip)} .dm .mu{fill:var(--urban)} .dm .mw{fill:var(--sea)}
.dm .mr1,.dm .mr2{fill:none;stroke:var(--river);stroke-linecap:round;stroke-linejoin:round} .dm .mr1{stroke-width:2.6} .dm .mr2{stroke-width:1.4}
.dm .mp{fill:none;stroke:var(--muted);stroke-width:.7;stroke-dasharray:3 3;opacity:.6} .dm .mb{fill:none;stroke:var(--lacquer);stroke-width:1.2;stroke-dasharray:5 3;opacity:.7}
.dm .rm{fill:none;stroke:var(--road-major);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round} .dm .rs{fill:none;stroke:var(--road);stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round}
.dm .mlp{fill:var(--muted)} .dm .mlt{fill:var(--muted);font:700 10px var(--body);paint-order:stroke;stroke:var(--land-trip);stroke-width:3px;stroke-linejoin:round}
.dm .pin circle{stroke:#fff;stroke-width:2} .dm .pin text{fill:#fff;font:800 10px var(--body);text-anchor:middle;dominant-baseline:central}
.dm .pin.act circle{fill:var(--lacquer)} .dm .pin.home circle{fill:var(--jade)} .dm .pin.sel circle{stroke:var(--gold);stroke-width:3.5}
.dm .pinline{fill:none;stroke:var(--lacquer);stroke-width:1.4;stroke-dasharray:3 3;opacity:.55}
.dm image.tile{filter:var(--tilefilter)}
.thumb .dm .mlt,.thumb .dm .mlp{display:none}

.alert{background:var(--warn-bg);padding:12px 14px;font-size:14px;border-radius:14px}
.alert b{color:var(--warn)}

/* ---- Timeline rows ---- */
.tl{display:flex;flex-direction:column;background:var(--surface);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;min-height:48px}
.tl:empty::before{content:"Drop plans here";display:block;padding:14px;color:var(--muted);font-size:14px;text-align:center}
.row{display:grid;grid-template-columns:22px 46px 1fr auto;gap:8px;padding:12px 12px 12px 6px;border-top:1px solid var(--line);align-items:start;background:var(--surface)}
.row:first-child{border-top:0}
.grip{width:22px;height:30px;border:0;background:none;padding:0;display:grid;place-items:center;touch-action:none;cursor:grab;color:var(--muted);border-radius:6px}
.grip svg{width:12px;height:18px;fill:currentColor}
.grip:hover{background:var(--sunk)}
.row .time{font-family:var(--mono);font-size:13px;padding-top:3px;color:var(--muted)}
.row .body{min-width:0}
.row .kind{font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.row.ticket .kind{color:var(--jade)}
.row.ticket .time{color:var(--ink);font-weight:500}
.row .title{font-weight:700}
.row .desc{font-size:13.5px;line-height:1.4;color:var(--muted);font-style:italic;margin-top:2px;max-width:46ch}
.row .detail{font-size:14px;color:var(--muted)}
.row.done .title{text-decoration:line-through;color:var(--muted)}
.row.placeholder{opacity:.35;background:var(--jade-soft)}
.row.ghost{position:fixed;z-index:20;pointer-events:none;box-shadow:0 12px 30px rgba(30,40,30,.25);border-radius:14px;border:2px solid var(--jade);transform:rotate(-1deg)}
.moved{display:inline-block;font-size:11px;font-weight:800;color:var(--moss);margin-left:6px}
.fav{color:var(--gold);font-size:13px;margin-left:4px}
.tag{display:inline-block;font-size:11px;font-weight:800;background:var(--sunk);color:var(--muted);padding:1px 8px;border-radius:999px;margin-left:6px;vertical-align:1px}
.tag.no{background:var(--warn-bg);color:var(--warn)}
.check{width:28px;height:28px;border:1.5px solid var(--line);border-radius:50%;background:var(--surface);display:grid;place-items:center;padding:0;flex:0 0 auto}
.check svg{width:14px;height:14px;stroke:var(--surface);stroke-width:3;fill:none}
.check[aria-pressed="true"]{background:var(--jade);border-color:var(--jade)}
.code{display:inline-flex;align-items:center;gap:8px;margin-top:6px;font-family:var(--mono);font-size:14px;background:var(--jade-soft);padding:3px 4px 3px 10px;border-radius:999px}
.code button{border:0;background:var(--surface);border-radius:999px;font-size:12px;padding:3px 10px;font-weight:800;font-family:var(--body)}
.addcode{white-space:nowrap;margin-top:6px;border:1.5px dashed var(--line);background:transparent;border-radius:999px;font-size:13px;font-weight:800;color:var(--jade);padding:3px 12px}
.inlinecode{display:flex;gap:8px;margin-top:8px}
.inlinecode input{flex:1;min-width:0;font-family:var(--mono)}
.inlinecode button,.btn{border:0;background:var(--jade);color:var(--on-jade);border-radius:12px;padding:10px 16px;font-weight:800;font-size:15px}
.btn.ghost{background:var(--sunk);color:var(--ink)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.subhead{font-size:12px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:12px 14px 0}
.hint{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center}
.hint svg{width:10px;height:15px;fill:currentColor;flex:0 0 auto}

textarea,input[type=text]{width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;font-size:16px}
textarea{min-height:80px;resize:vertical}
label.fld{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
label.fld input{font-family:var(--mono);letter-spacing:0;text-transform:none;color:var(--ink);padding:9px 11px;font-weight:500}

/* ---- Today ---- */
.next{background:linear-gradient(145deg,var(--jade),var(--jade-deep));color:var(--on-jade);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow)}
.next .eyebrow{color:inherit;opacity:.8}
.next .big{font-family:var(--display);font-weight:800;font-size:28px;line-height:1.15}
.next .t{font-size:15px;opacity:.95}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mini{background:var(--surface);border:0;box-shadow:var(--shadow);border-radius:16px;padding:12px 14px;min-width:0;color:var(--ink);text-align:left}
.mini .v{font-weight:800;margin-top:2px}

/* ---- Bookings ---- */
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:0;background:var(--surface);box-shadow:var(--shadow);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:800}
.seg button[aria-pressed="true"]{background:var(--jade);color:var(--on-jade)}
.pass{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.pass .route{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:8px;padding:16px 16px 10px}
.pass .ap{font-family:var(--display);font-weight:800;font-size:32px;line-height:1}
.pass .ap.r{text-align:right}
.pass .when{font-size:13px;color:var(--muted);margin-top:4px;font-weight:600}
.pass .mid{font-size:12px;color:var(--gold);text-align:center;padding-bottom:6px;max-width:120px;font-weight:800}
.pass .carrier{padding:0 16px 12px;font-weight:800;font-size:15px}
.pass .carrier span{font-weight:400;color:var(--muted)}
.pass .stub{border-top:1.5px dashed var(--line);background:var(--sunk);padding:12px 16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.pass .stub.one{grid-template-columns:1fr}
.hotelname{font-family:var(--display);font-weight:800;font-size:22px;line-height:1.15}

/* ---- Food ---- */
.foodcity{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.foodcity h3{margin:0;padding:14px 16px;font-family:var(--display);font-weight:800;font-size:20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.foodcity h3 .local{color:var(--gold);font-size:15px;margin-left:6px}
.foodcity h3 small{font-family:var(--body);font-weight:800;font-size:12px;color:var(--muted)}
.food{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 16px;border-top:1px solid var(--line)}
.food:first-of-type{border-top:0}
.food .n{min-width:0}
.food .n small{display:block;color:var(--muted);font-size:13px}
a.map{flex:0 0 auto;font-size:13px;font-weight:800;color:var(--jade);text-decoration:none;background:var(--jade-soft);padding:5px 12px;border-radius:999px}

/* ---- Essentials ---- */
.card{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:12px}
.doc{display:grid;grid-template-columns:28px 1fr;gap:12px;align-items:start}
.doc .t{font-weight:800}
.doc .d{font-size:14px;color:var(--muted)}
.emb{display:flex;flex-direction:column;gap:6px;padding-top:12px;border-top:1px solid var(--line)}
.emb:first-child{border-top:0;padding-top:0}
.emb .who{font-weight:800}
.emb .who small{display:block;font-weight:600;color:var(--muted);font-size:13px}
.emb .addr{font-size:14px}
.emb .local{font-size:14px;color:var(--muted)}
.emb .ph{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:14px}
.emb .ph .code{margin-top:0}
.emb .ph span{color:var(--muted);font-size:13px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 8px;border-top:1px solid var(--line);vertical-align:top}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:800;border-top:0}
td.mono{white-space:nowrap}

/* ---- Sheet & toast ---- */
.scrim{position:fixed;inset:0;background:rgba(20,25,20,.4);z-index:30}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--surface);border-radius:22px 22px 0 0;max-height:78vh;overflow:auto;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:10px;box-shadow:0 -10px 30px rgba(0,0,0,.2)}
.sheet-in{max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto}
.sheet h3{margin:0;font-family:var(--display);font-weight:800;font-size:20px}
.daylist{display:flex;flex-direction:column;gap:6px}
.daylist button{display:flex;justify-content:space-between;gap:10px;background:var(--sunk);border:0;border-radius:12px;padding:10px 14px;font-weight:700;text-align:left}
.daylist button[aria-current="true"]{background:var(--jade-soft);outline:2px solid var(--jade)}
.daylist button span{color:var(--muted);font-family:var(--mono);font-size:13px;font-weight:400}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;font-weight:700;z-index:40;max-width:90vw;text-align:center}

/* ---- Today: at a glance ---- */
.glance{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.glance h3{margin:0;padding:12px 16px;display:flex;justify-content:space-between;align-items:baseline;font-family:var(--display);font-weight:800;font-size:18px;border-bottom:1px solid var(--line)}
.glance h3 small{font-family:var(--body);font-size:12px;font-weight:800;color:var(--muted)}
.gl{width:100%;border:0;background:none;text-align:left;display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:10px 16px;border-top:1px solid var(--line)}
.gl:first-of-type{border-top:0}
.gl:hover{background:var(--sunk)}
.gl .gd{display:flex;flex-direction:column;align-items:center;line-height:1;background:var(--sunk);border-radius:10px;padding:6px 0}
.gl .gd b{font-family:var(--display);font-weight:800;font-size:18px}
.gl .gd small{font-size:9.5px;font-weight:800;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;margin-top:2px}
.gl .gm{min-width:0}
.gl .gi svg{width:14px;height:14px;stroke:var(--jade);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-2px;margin-right:6px}
.gl .gr,.gl .gn,.gl .gs{display:block}
.gl .gr{font-family:var(--mono);font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gl .gn{font-weight:800;font-size:15px;line-height:1.25}
.gl .gs{font-size:12.5px;color:var(--muted);font-weight:600}
.gl .gc{font-family:var(--mono);font-size:11.5px;color:var(--jade);background:var(--jade-soft);border-radius:999px;padding:1px 7px;margin-left:4px}
.gl .gt{font-family:var(--mono);font-size:14px;text-align:right;white-space:nowrap}
.gl .gt small{display:block;font-size:11px;color:var(--muted)}
.gl.past{opacity:.45}
.gl.nextup{background:var(--jade-soft)}
.gl.nextup .gd{background:var(--jade);color:var(--on-jade)}
.gl.nextup .gd small{color:inherit;opacity:.85}
/* ---- Converter ---- */
.conv{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:12px}
.conv-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.cv-in{display:flex;align-items:center;gap:8px;background:var(--jade-soft);border-radius:16px;padding:6px 14px}
.cv-sym{font-family:var(--display);font-weight:800;font-size:28px;color:var(--jade)}
.cv-in input{flex:1;min-width:0;border:0;background:transparent;font-family:var(--display);font-weight:800;font-size:34px;padding:4px 0;color:var(--ink)}
.cv-in input:focus{outline:none}
.cv-in:focus-within{outline:2px solid var(--jade)}
.cv-seg button{padding:6px 12px;font-size:13px}
.cv-list{display:flex;flex-direction:column}
.cv-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:9px 2px;border-top:1px solid var(--line)}
.cv-row:first-child{border-top:0}
.cv-c{font-weight:800}
.cv-c small{display:block;font-weight:600;font-size:12px;color:var(--muted)}
.cv-v{font-size:17px;font-weight:500}
.cv-row.usd .cv-v{color:var(--jade);font-size:20px}
.cv-edit{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;align-items:end}

/* ---- Journal ---- */
.jlist{display:flex;flex-direction:column;gap:14px}
.jday{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:14px 16px;display:flex;flex-direction:column;gap:12px;border-left:5px solid var(--c);scroll-margin-top:110px}
.jday.today{outline:2px solid var(--gold);outline-offset:2px}
.jday header{display:flex;align-items:center;gap:12px}
.jdate{flex:0 0 auto;width:46px;height:50px;border-radius:12px;background:var(--sunk);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.jdate b{font-family:var(--display);font-weight:800;font-size:21px}
.jdate small{font-size:10px;font-weight:800;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-top:2px}
.jcity{font-family:var(--display);font-weight:800;font-size:19px;line-height:1.15}
.jcity span{color:var(--gold);font-size:14px;margin-left:6px}
.jbtn{margin-left:auto;padding:7px 12px;font-size:14px;flex:0 0 auto}
.jentry{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:6px}
.jwho{display:flex;align-items:center;gap:10px;font-weight:800;font-size:14px;color:var(--jade)}
.jfield{font-size:15px}
.jfield span{display:block;font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.jnote{white-space:pre-wrap;color:var(--ink)}
.jempty{padding-left:58px;margin-top:-6px}
.jform{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:10px}
.jform label.fld input{font-family:var(--body);font-size:16px}
.stars{display:inline-flex;gap:2px}
.star{color:var(--line);font-size:16px;line-height:1}
.star.on{color:var(--gold)}
button.star{border:0;background:none;padding:2px 3px;font-size:24px}

/* ---- Sync ---- */
.syncline{display:flex;align-items:center;gap:8px;font-weight:800}
.syncdot{width:10px;height:10px;border-radius:50%;background:var(--muted);flex:0 0 auto}
.syncdot.synced{background:var(--jade)} .syncdot.saving,.syncdot.connecting{background:var(--gold)} .syncdot.offline{background:var(--muted)} .syncdot.error{background:var(--lacquer)}
.top .syncdot{border:2px solid var(--on-jade);width:12px;height:12px}
.top .syncdot.synced{background:#8FD3B4}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
pre.rules{margin:0;background:var(--sunk);border-radius:12px;padding:12px;font-family:var(--mono);font-size:12px;overflow-x:auto;white-space:pre}
#setupbox,#joinbox{display:flex;flex-direction:column;gap:10px}
#setupbox[hidden],#joinbox[hidden]{display:none}
.linkbtn{border:0;background:none;color:var(--jade);font-weight:800;padding:0;text-decoration:underline}
.tabs button{font-size:11px}

@media (prefers-reduced-motion:no-preference){.view{animation:in .22s ease-out}@keyframes in{from{opacity:.5;transform:translateY(5px)}to{opacity:1;transform:none}}}
@media (max-width:380px){.pass .ap{font-size:26px}.top h1{font-size:19px}.overview{grid-template-columns:1fr}.overview svg{min-height:0;height:220px}}

  return d>0?`${p(d,"day")}, ${p(h,"hr")}`:h>0?`${p(h,"hr")}, ${p(mi,"min")}`:p(mi,"min");
}

const APP=TILES; // installed app only
const SYNC={on:false,db:null,trip:store.get("trip",null),cfg:store.get("fbcfg",null),status:"off",unsub:[]};
const SYNC_KEYS=["done","notes","book","docs","layout","journal"];
const LAST={};let pushT={};
const clone=o=>JSON.parse(JSON.stringify(o||{}));
function diff(cur,last){const set={},del=[];cur=cur||{};last=last||{};
  for(const k in cur)if(JSON.stringify(cur[k])!==JSON.stringify(last[k]))set[k]=cur[k];
  for(const k in last)if(!(k in cur))del.push(k);return{set,del}}
function queuePush(k){if(!SYNC.on)return;clearTimeout(pushT[k]);pushT[k]=setTimeout(()=>{delete pushT[k];push(k)},k==="notes"||k==="book"?700:150)}
function push(k){
  if(!SYNC.on)return;const ref=SYNC.db.doc(`trips/${SYNC.trip}/state/${k}`);
  if(k==="layout"){ref.set({v:JSON.stringify(S.layout||{})});LAST.layout=clone(S.layout);return}
  const {set,del}=diff(S[k],LAST[k]);
  if(Object.keys(set).length)ref.set(set,{merge:true}).catch(()=>{});
  if(del.length){const FP=firebase.firestore.FieldPath,FV=firebase.firestore.FieldValue;const args=[];del.forEach(x=>{args.push(new FP(x),FV.delete())});ref.update(...args).catch(()=>{})}
  LAST[k]=clone(S[k]);
}
function loadScript(src){return new Promise((ok,no)=>{const s=document.createElement("script");s.src=src;s.onload=ok;s.onerror=no;document.head.appendChild(s)})}
let renderPending=false;

document.addEventListener("focusout",()=>setTimeout(()=>{if(renderPending&&!(document.activeElement&&document.activeElement.matches("input,textarea"))){renderPending=false;render()}},50));
async function startSync(){
  if(!APP||!SYNC.cfg||!SYNC.trip)return;
  SYNC.status="connecting";
  try{
    const V="https://cdn.jsdelivr.net/npm/firebase@10.12.2/";
    if(!window.firebase){await loadScript(V+"firebase-app-compat.js");await loadScript(V+"firebase-auth-compat.js");await loadScript(V+"firebase-firestore-compat.js")}
    if(!firebase.apps.length)firebase.initializeApp(SYNC.cfg);
    const db=firebase.firestore();try{await db.enablePersistence({synchronizeTabs:true})}catch(e){}
    await new Promise(r=>{const u=firebase.auth().onAuthStateChanged(x=>{u();r(x)})});
    if(!firebase.auth().currentUser){try{await firebase.auth().signInAnonymously()}catch(e){SYNC.err=e.code||e.message;if(navigator.onLine){SYNC.status="error";updateSyncBadge();return}}}
    SYNC.db=db;SYNC.on=true;
    let first={};
    SYNC_KEYS.forEach(k=>{
      const ref=db.doc(`trips/${SYNC.trip}/state/${k}`);
      SYNC.unsub.push(ref.onSnapshot({includeMetadataChanges:true},snap=>{
        SYNC.status=snap.metadata.fromCache?"offline":snap.metadata.hasPendingWrites?"saving":"synced";SYNC.when=new Date();
        if(snap.metadata.hasPendingWrites){updateSyncBadge();return}
        const data=snap.data();
        if(!first[k]){first[k]=1;
          if(!data){LAST[k]={};push(k);updateSyncBadge();return} // first phone: upload what's here
          if(k!=="layout"){const local=S[k]||{};const merged={...data};for(const x in local)if(!(x in merged))merged[x]=local[x];S[k]=merged;LAST[k]=clone(data);store.set(k,S[k]);push(k)}
          else{S.layout=data.v?JSON.parse(data.v):{};fixLayout();LAST.layout=clone(S.layout);store.set("layout",S.layout)}
          softRender();updateSyncBadge();return}
        const pending=pushT[k]&&k!=="layout"?diff(S[k],LAST[k]):null;
        if(k==="layout"){S.layout=data&&data.v?JSON.parse(data.v):{};fixLayout();LAST.layout=clone(S.layout)}
        else{S[k]=clone(data||{});LAST[k]=clone(S[k]);if(pending){Object.assign(S[k],pending.set);pending.del.forEach(x=>delete S[k][x])}}
        store.set(k,S[k]);softRender();updateSyncBadge();
      },err=>{SYNC.err=(err&&(err.code||err.message))||"unknown";SYNC.status="error";updateSyncBadge()}));
    });
  }catch(e){SYNC.err=(e&&(e.code||e.message))||"Couldn't load the sync library. Check the internet connection.";SYNC.status="error";updateSyncBadge()}
}

  if(act==="retrysync"){SYNC.unsub.forEach(u=>u());SYNC.unsub=[];SYNC.on=false;SYNC.err=null;SYNC.status="connecting";render();startSync().then(()=>{render()});return true}
  if(act==="showsetup"){$("#setupbox").hidden=false;$("#joinbox").hidden=true;return true}
  if(act==="showjoin"){$("#joinbox").hidden=false;$("#setupbox").hidden=true;return true}
  if(act==="copyrules"){const t=$("#rulestxt").textContent;navigator.clipboard?.writeText(t).then(()=>toast("Rules copied")).catch(()=>toast("Select the rules and copy them"));return true}
  if(act==="createtrip"){const c=parseConfig($("#cfgbox").value);if(!c){toast("That doesn't look like a firebaseConfig block. Copy the whole block and paste again.");return true}
    SYNC.cfg=c;SYNC.trip=newTripCode();store.set("fbcfg",c);store.set("trip",SYNC.trip);render();startSync();toast("Sync is on. Now copy the invite for the other phone.");return true}
  if(act==="jointrip"){try{const v=$("#invbox").value.trim().replace(/^TVC1:/,"");const o=JSON.parse(decodeURIComponent(escape(atob(v))));if(!o.c||!o.t)throw 0;
    SYNC.cfg=o.c;SYNC.trip=o.t;store.set("fbcfg",o.c);store.set("trip",o.t);render();startSync();toast("Joined. Our phones are now in sync.")}catch(e){toast("That invite isn't complete. Ask for it again and paste the whole text.")}return true}
  if(act==="copyinvite"){const t=inviteCode();navigator.clipboard?.writeText(t).then(()=>toast("Invite copied. Text it to the other phone.")).catch(()=>toast("Couldn't copy. Try again."));return true}
  if(act==="askstopsync"){$("#stopwrap").innerHTML=`<div class="btns"><span class="small">Stop syncing on this phone? Your data stays here.</span><button class="btn" data-act="stopsync">Turn off</button><button class="btn ghost" data-act="keepsync">Keep syncing</button></div>`;return true}
  if(act==="keepsync"){$("#stopwrap").innerHTML="";return true}
  if(act==="stopsync"){SYNC.unsub.forEach(u=>u());SYNC.unsub=[];SYNC.on=false;SYNC.cfg=null;SYNC.trip=null;SYNC.status="off";store.set("fbcfg",null);store.set("trip",null);render();toast("Sync is off on this phone");return true}
  if(act==="renameme"){ME="";store.set("me","");go("journal");return true}
  return false;
}

// ---------- Move sheet ----------
let sheetId=null;
function openSheet(id){
  sheetId=id;const it=ITEM[id],cur=DAYS.find(d=>idsOf(d).includes(id));
  $("#sheetin").innerHTML=`<div class="grab"></div><h3>Move “${esc(it.title)}”</h3>
   <div class="btns"><button class="btn ghost" data-mv="-1">Move up</button><button class="btn ghost" data-mv="1">Move down</button>${HOME[id]!==cur.date?`<button class="btn ghost" data-mvhome="1">Back to ${fmtDate(HOME[id])}</button>`:""}</div>
   <div class="eyebrow">Or move to another day</div>
   <div class="daylist">${DAYS.map(d=>`<button data-moveto="${d.date}" aria-current="${d===cur}"><b>${fmtDate(d.date)} · ${esc(d.city)}</b><span>${idsOf(d).length}</span></button>`).join("")}</div>
   <button class="btn ghost" data-act="closesheet">Cancel</button>`;
  $("#sheet").hidden=false;$("#scrim").hidden=false;
}
function closeSheet(){$("#sheet").hidden=true;$("#scrim").hidden=true;sheetId=null}

// ---------- Drag and drop ----------
let drag=null;
document.addEventListener("pointerdown",e=>{
  const g=e.target.closest(".grip");if(!g)return;
  const row=g.closest(".row");e.preventDefault();
  drag={id:row.dataset.id,row,x0:e.clientX,y0:e.clientY,moved:false,drop:null,vy:0};
  try{g.setPointerCapture(e.pointerId)}catch(_){}
});
document.addEventListener("pointermove",e=>{
  if(!drag)return;
  if(!drag.moved){
    if(Math.hypot(e.clientX-drag.x0,e.clientY-drag.y0)<6)return;
    const r=drag.row.getBoundingClientRect();
    drag.ghost=drag.row.cloneNode(true);drag.ghost.classList.add("ghost");
    Object.assign(drag.ghost.style,{left:r.left+"px",width:r.width+"px",top:r.top+"px"});
    document.body.appendChild(drag.ghost);document.body.classList.add("dropping");drag.off=e.clientY-r.top;drag.row.classList.add("placeholder");drag.moved=true;
    const loop=()=>{if(!drag)return;if(drag.vy)window.scrollBy(0,drag.vy);requestAnimationFrame(loop)};requestAnimationFrame(loop);
  }
  e.preventDefault();
  const y=e.clientY;drag.ghost.style.top=(y-drag.off)+"px";
  const H=window.innerHeight;drag.vy=y<110?-Math.ceil((110-y)/7):y>H-130?Math.ceil((y-(H-130))/7):0;
  const el=document.elementFromPoint(e.clientX,y);
  document.querySelectorAll("[data-dropday].over").forEach(h=>h.classList.remove("over"));drag.drop=null;
  if(!el)return;
  const r=el.closest(".tl[data-date] .row");
  if(r&&r!==drag.row){const b=r.getBoundingClientRect();if(y<b.top+b.height/2)r.before(drag.row);else r.after(drag.row);return}
  const tl=el.closest(".tl[data-date]");if(tl&&!tl.contains(drag.row)){tl.appendChild(drag.row);return}
  const dz=el.closest("[data-dropday]");if(dz){dz.classList.add("over");drag.drop=dz.dataset.dropday}
},{passive:false});
function endDrag(){
  if(!drag)return;const d=drag;drag=null;
  if(!d.moved){openSheet(d.id);return}
  d.ghost.remove();d.row.classList.remove("placeholder");document.body.classList.remove("dropping");
  const from=DAYS.find(x=>idsOf(x).includes(d.id)).date;
  if(d.drop){moveItem(d.id,d.drop);toast("Moved to "+fmtDate(d.drop)+" · "+DAYS.find(x=>x.date===d.drop).city)}
  else{materialize();document.querySelectorAll(".tl[data-date]").forEach(tl=>{S.layout[tl.dataset.date]=[...tl.querySelectorAll(".row[data-id]")].map(r=>r.dataset.id)});
    const ids=new Set();DAYS.forEach(x=>S.layout[x.date].forEach(i=>ids.add(i)));
    const L=S.layout[from];if(!ids.has(d.id))L.push(d.id); // safety
    save("layout");const to=DAYS.find(x=>S.layout[x.date].includes(d.id)).date;if(to!==from)toast("Moved to "+fmtDate(to))}
  render();
}
document.addEventListener("pointerup",endDrag);
document.addEventListener("pointercancel",()=>{if(drag&&drag.moved){drag.ghost.remove();document.body.classList.remove("dropping");drag=null;render()}else drag=null});

// ---------- Clicks ----------
document.addEventListener("click",e=>{
  const pin=e.target.closest(".pin[data-pin]");if(pin){const id=pin.dataset.pin;const row=id==="hotel"?document.querySelector(".tl .row .pnum.h")?.closest(".row"):document.querySelector(`.row[data-id="${CSS.escape(id)}"]`);
    document.querySelectorAll(".pin.sel").forEach(p=>p.classList.remove("sel"));pin.classList.add("sel");if(row){row.scrollIntoView({behavior:"smooth",block:"center"});row.classList.remove("flash");void row.offsetWidth;row.classList.add("flash")}return}
  const ov=e.target.closest(".ovdot");if(ov){jumpTo(ov.dataset.date);return}
  const b=e.target.closest("button,[data-tab]");if(!b)return;
  if(b.classList.contains("grip"))return;
  if(b.dataset.tab){go(b.dataset.tab);return}
  if(b.dataset.act&&syncClick(b.dataset.act,b))return;
  if(b.dataset.cur){convFrom=b.dataset.cur;store.set("convFrom",convFrom);render();return}
  if(b.dataset.act==="editrates"){editRates=!editRates;render();return}
  if(b.dataset.act==="resetrates"){RATES={...DEFAULT_RATES,_date:"19 Oct 2026"};store.set("rates",RATES);render();autoRates();return}
  if(b.dataset.act==="updaterates"){updateRates(b);return}
  if(b.dataset.act==="setme"){const v=$("#mename").value.trim();if(!v){toast("Type your name first");return}ME=v;store.set("me",v);render();return}
  if(b.dataset.jedit){jEdit=b.dataset.jedit;const m=S.journal[jKey(jEdit,ME)];jStars=m?m.stars||0:0;render();const el=document.getElementById("j-"+jEdit);if(el)el.scrollIntoView({block:"start"});return}
  if(b.dataset.jcancel){jEdit=null;render();return}
  if(b.dataset.star){jStars=+b.dataset.star;b.parentElement.querySelectorAll(".star").forEach((x,i)=>x.classList.toggle("on",i<jStars));return}
  if(b.dataset.jsave){const d=b.dataset.jsave,g=id=>($("#"+CSS.escape(id+d))||{}).value?.trim()||"";
    const e={hl:g("jhl-"),meal:g("jmeal-"),note:g("jnote-"),stars:jStars,at:Date.now()};const k=jKey(d,ME);
    if(!e.hl&&!e.meal&&!e.note&&!e.stars)delete S.journal[k];else S.journal[k]=e;save("journal");jEdit=null;render();toast("Entry saved");return}
  if(b.dataset.jjump){const el=document.getElementById("j-"+b.dataset.jjump);if(el)el.scrollIntoView({behavior:"smooth",block:"start"});return}
  if(b.dataset.sel){selectDay(b.dataset.sel,b.classList.contains("pc"));return}
  if(b.dataset.back){backToGrid();return}
  if(b.dataset.act==="savemaps"){saveMaps(b);return}
  if(b.dataset.jump){jumpTo(b.dataset.jump);return}
  if(b.dataset.moveto){const id=sheetId;moveItem(id,b.dataset.moveto);closeSheet();render();toast("Moved to "+fmtDate(b.dataset.moveto));return}
  if(b.dataset.mv){const id=sheetId,d=DAYS.find(x=>idsOf(x).includes(id)),L=idsOf(d),i=L.indexOf(id);moveItem(id,d.date,Math.max(0,i+(+b.dataset.mv)));closeSheet();render();return}
  if(b.dataset.mvhome){const id=sheetId;moveItem(id,HOME[id],DAYS.find(x=>x.date===HOME[id]).items.findIndex(x=>x.id===id));closeSheet();render();toast("Moved back");return}
  if(b.dataset.act==="closesheet"){closeSheet();return}
  if(b.dataset.edit){editing=b.dataset.edit;render();const i=document.querySelector(".inlinecode input");if(i)i.focus();return}
  if(b.dataset.savecode){const r=b.dataset.savecode,v=$("#"+CSS.escape(b.dataset.for)).value.trim();S.book[r]=S.book[r]||{};S.book[r].conf=v;save("book");editing=null;render();toast(v?"Code saved":"Code removed");return}
  if(b.dataset.seg){bookSeg=b.dataset.seg;store.set("seg",bookSeg);render();return}
  if(b.dataset.done){const id=b.dataset.done;if(S.done[id])delete S.done[id];else S.done[id]=1;save("done");render();return}
  if(b.dataset.doc){const id=b.dataset.doc;S.docs[id]=!S.docs[id];save("docs");render();return}
  if(b.dataset.copy!==undefined){const t=b.dataset.copy;navigator.clipboard?.writeText(t).then(()=>toast("Copied "+t)).catch(()=>toast(t));return}
  if(b.dataset.act==="export"){const data=JSON.stringify({v:3,done:S.done,notes:S.notes,book:S.book,docs:S.docs,layout:S.layout,journal:S.journal});
    navigator.clipboard?.writeText(data).then(()=>toast("Copied. Paste it into a message to the other phone.")).catch(()=>{const t=$("#expbox");t.hidden=false;t.value=data;t.select();toast("Select all and copy")});return}
  if(b.dataset.act==="showimport"){$("#imp").hidden=false;$("#impbox").focus();return}
  if(b.dataset.act==="import"){try{const d=JSON.parse($("#impbox").value);["done","notes","book","docs","layout","journal"].forEach(k=>{if(d[k]&&typeof d[k]==="object"){S[k]=d[k];save(k)}});fixLayout();toast("Backup restored");render()}catch(err){toast("That text isn't a valid backup. Copy it again and paste the whole thing.")}return}
  if(b.dataset.act==="askreset"){$("#resetwrap").innerHTML=`<span class="small">Put every plan back on its original day?</span><button class="btn" data-act="reset">Reset</button><button class="btn ghost" data-act="noreset">Keep my order</button>`;return}
  if(b.dataset.act==="noreset"){render();return}
  if(b.dataset.act==="reset"){S.layout={};save("layout");render();toast("Plan order reset");return}
});
$("#scrim").addEventListener("click",closeSheet);
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&sheetId)closeSheet()});
document.addEventListener("input",e=>{
  const el=e.target;
  if(el.id==="cvamt"){convAmt=el.value;store.set("convAmt",convAmt);const l=$("#cvlist");if(l)l.innerHTML=convResults();return}
  if(el.dataset.rate){const v=parseFloat(el.value.replace(/,/g,""));if(v>0){RATES[el.dataset.rate]=v;RATES._custom=true;store.set("rates",RATES);document.querySelectorAll("#cvlist").forEach(l=>l.innerHTML=convResults())}return}
  if(el.dataset.note){S.notes[el.dataset.note]=el.value;save("notes")}
  if(el.dataset.book){const r=el.dataset.book;S.book[r]=S.book[r]||{};S.book[r][el.dataset.key]=el.value.trim();save("book")}
});
let sx=null;
document.addEventListener("touchstart",e=>{if(e.target.closest("#hero")&&e.touches.length===1)sx=[e.touches[0].clientX,e.touches[0].clientY];else sx=null},{passive:true});
document.addEventListener("touchend",e=>{if(!sx||tab!=="days"||!SEL)return;const t=e.changedTouches[0],dx=t.clientX-sx[0],dy=t.clientY-sx[1];sx=null;
  if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5){const i=DAYS.findIndex(d=>d.date===SEL),j=i+(dx<0?1:-1);if(DAYS[j])selectDay(DAYS[j].date,false)}});
async function saveMaps(btn){
  if(!("caches" in window)){toast("This browser can't save maps offline.");return}
  const urls=[...new Set(tileUrls())];let ok=0;btn.disabled=true;
  const c=await caches.open("asia26-tiles");
  for(const u of urls){try{const r=await fetch(u,{mode:"no-cors"});await c.put(u,r);ok++;btn.textContent=`Saving maps ${ok} of ${urls.length}`}catch(e){}}
  btn.textContent=ok===urls.length?"Street maps saved for offline":`Saved ${ok} of ${urls.length}. Try again on Wi-Fi.`;btn.disabled=false;
}
render();startSync().then(updateSyncBadge);autoRates();
window.addEventListener("online",autoRates);document.addEventListener("visibilitychange",()=>{if(!document.hidden)autoRates()});
setInterval(()=>{if(tab==="today"&&!drag&&!document.querySelector(".flash")&&!document.activeElement.matches("input,textarea"))render()},60000);
if("serviceWorker" in navigator&&document.querySelector('link[rel="manifest"]')){navigator.serviceWorker.register("sw.js").catch(()=>{})}
</script>
