<style>
/* Layout: phone-first app shell, lacquer header with a soft wave pattern, rounded paper cards, fixed bottom tab bar. Rice paper, cinnabar lacquer, jade and temple gold. */
:root{
  --bg:#FAF3E8; --surface:#FFFDF8; --sunk:#F4EADA; --ink:#3B2A22; --muted:#8B776A; --line:#ECDFCC;
  --lacquer:#B23A2E; --on-lacquer:#FFF7EE; --jade:#3D7C67; --gold:#C8963A; --accent:#B23A2E; --good:#3D7C67;
  --warn:#B23A2E; --warn-bg:#FBE8DF; --shadow:0 1px 2px rgba(80,45,25,.06),0 6px 18px rgba(80,45,25,.07);
  --display:"Shippori Mincho","Songti SC",Georgia,serif;
  --body:"Nunito",-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"DM Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1D1613; --surface:#28201B; --sunk:#322720; --ink:#F3E8DA; --muted:#B8A493; --line:#3D3029;
  --lacquer:#9E3328; --on-lacquer:#FFF3E6; --jade:#7DBFA5; --gold:#E3B665; --accent:#E8806B; --good:#5FA98C;
  --warn:#EE8D74; --warn-bg:#3A231C; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1D1613; --surface:#28201B; --sunk:#322720; --ink:#F3E8DA; --muted:#B8A493; --line:#3D3029;
  --lacquer:#9E3328; --on-lacquer:#FFF3E6; --jade:#7DBFA5; --gold:#E3B665; --accent:#E8806B; --good:#5FA98C;
  --warn:#EE8D74; --warn-bg:#3A231C; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--lacquer)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;color:var(--on-lacquer);background-color:var(--lacquer);
  background-image:radial-gradient(circle at 50% 100%,transparent 9px,rgba(255,240,220,.10) 10px,transparent 11px,transparent 15px,rgba(255,240,220,.10) 16px,transparent 17px);
  background-size:36px 18px;border-radius:0 0 20px 20px;box-shadow:0 4px 14px rgba(120,40,25,.18)}
.top-in{max-width:620px;margin:0 auto;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-block:14px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.top h1{margin:0;font-family:var(--display);font-weight:700;font-size:26px;line-height:1.05}
.top .sub{font-size:13px;opacity:.85;margin-top:2px;letter-spacing:.02em}
.top .badge{background:var(--on-lacquer);color:var(--lacquer);font-weight:700;font-size:13px;padding:5px 11px;border-radius:999px;white-space:nowrap}

main{max-width:620px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px calc(96px + env(safe-area-inset-bottom,0px))}
section.view{display:flex;flex-direction:column;gap:16px}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);box-shadow:0 -4px 18px rgba(80,45,25,.08);border-radius:20px 20px 0 0;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs-in{max-width:620px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabs button{background:none;border:0;padding:10px 2px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:700;color:var(--muted)}
.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current="page"]{color:var(--lacquer)}
.tabs button[aria-current="page"] svg{fill:color-mix(in srgb,var(--lacquer) 14%,transparent)}

h2.sec{margin:6px 0 0;font-family:var(--display);font-weight:700;font-size:22px;text-wrap:balance}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:14px}

.strip{display:flex;gap:8px;overflow-x:auto;padding:2px 4px 8px;margin-inline:-4px;scrollbar-width:none}
.chip{flex:0 0 auto;border:0;background:var(--surface);box-shadow:var(--shadow);border-radius:14px;padding:8px 12px;text-align:left;min-width:74px}
.chip .d{font-size:12px;color:var(--muted);font-weight:600}
.chip .c{font-family:var(--display);font-weight:700;font-size:15px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--lacquer);color:var(--on-lacquer)}
.chip[aria-pressed="true"] .d{color:inherit;opacity:.8}

.dayhead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.dayhead .city{font-family:var(--display);font-weight:800;font-size:36px;line-height:1.05}
.dayhead .local{font-family:var(--display);font-size:18px;color:var(--gold);margin-left:8px;font-weight:600}
.dayhead .date{font-size:14px;color:var(--muted);margin-top:2px;font-weight:600}
.cc{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.cc i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.cc.TH i{background:var(--gold)} .cc.VN i{background:var(--jade)} .cc.HK i,.cc.CN i{background:var(--lacquer)}

.alert{background:var(--warn-bg);color:var(--ink);padding:12px 14px;font-size:14px;border-radius:14px}
.alert b{color:var(--warn)}

.tl{display:flex;flex-direction:column;background:var(--surface);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.row{display:grid;grid-template-columns:50px 1fr auto;gap:10px;padding:13px 14px;border-top:1px solid var(--line);align-items:start}
.row:first-child{border-top:0}
.row .time{font-family:var(--mono);font-size:13px;font-weight:500;padding-top:2px;color:var(--muted)}
.row .body{min-width:0}
.row .kind{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.row.ticket .kind{color:var(--gold)}
.row.ticket .time{color:var(--ink)}
.row .title{font-weight:700}
.row .detail{font-size:14px;color:var(--muted)}
.row.done .title{text-decoration:line-through;color:var(--muted)}
.fav{color:var(--gold);font-size:13px;margin-left:4px}
.tag{display:inline-block;font-size:11px;font-weight:700;background:var(--sunk);color:var(--muted);padding:1px 8px;border-radius:999px;margin-left:6px;vertical-align:1px}
.tag.no{background:var(--warn-bg);color:var(--warn)}
.check{width:28px;height:28px;border:1.5px solid var(--line);border-radius:50%;background:var(--surface);display:grid;place-items:center;padding:0;flex:0 0 auto}
.check svg{width:14px;height:14px;stroke:var(--surface);stroke-width:3;fill:none}
.check[aria-pressed="true"]{background:var(--jade);border-color:var(--jade)}
.code{display:inline-flex;align-items:center;gap:8px;margin-top:6px;font-family:var(--mono);font-size:14px;background:var(--sunk);padding:3px 4px 3px 10px;border-radius:999px}
.code button{border:0;background:var(--surface);border-radius:999px;font-size:12px;padding:3px 10px;font-weight:700;font-family:var(--body)}
.addcode{margin-top:6px;border:1px dashed var(--line);background:transparent;border-radius:999px;font-size:13px;font-weight:700;color:var(--accent);padding:3px 12px}
.inlinecode{display:flex;gap:8px;margin-top:8px}
.inlinecode input{flex:1;min-width:0;font-family:var(--mono)}
.inlinecode button{border:0;background:var(--lacquer);color:var(--on-lacquer);border-radius:10px;padding:0 14px;font-weight:700}

.subhead{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:12px 14px 0}

textarea,input[type=text]{width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;font-size:16px}
textarea{min-height:84px;resize:vertical}
label.fld{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
label.fld input{font-family:var(--mono);letter-spacing:0;text-transform:none;color:var(--ink);padding:9px 11px;font-weight:500}

.next{background:linear-gradient(140deg,var(--jade),color-mix(in srgb,var(--jade) 72%,#1d3a30));color:#FBF6EC;border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow)}
.next .eyebrow{color:inherit;opacity:.8}
.next .big{font-family:var(--display);font-weight:800;font-size:28px;line-height:1.15}
.next .t{font-size:15px;opacity:.95}
.next .code{background:rgba(255,255,255,.16);color:inherit}
.next .code button{background:#FBF6EC;color:#2c4b40}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mini{background:var(--surface);border:0;box-shadow:var(--shadow);border-radius:16px;padding:12px 14px;min-width:0;color:var(--ink)}
.mini .v{font-weight:700;margin-top:2px}

.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:0;background:var(--surface);box-shadow:var(--shadow);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--lacquer);color:var(--on-lacquer)}
.pass{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.pass .route{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:8px;padding:16px 16px 10px}
.pass .ap{font-family:var(--display);font-weight:800;font-size:32px;line-height:1}
.pass .ap.r{text-align:right}
.pass .when{font-size:13px;color:var(--muted);margin-top:4px;font-weight:600}
.pass .mid{font-size:12px;color:var(--gold);text-align:center;padding-bottom:6px;max-width:120px;font-weight:700}
.pass .carrier{padding:0 16px 12px;font-weight:700;font-size:15px}
.pass .carrier span{font-weight:400;color:var(--muted)}
.pass .stub{border-top:1.5px dashed var(--line);background:var(--sunk);padding:12px 16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.pass .stub.one{grid-template-columns:1fr}
.hotelname{font-family:var(--display);font-weight:800;font-size:22px;line-height:1.15}

.foodcity{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.foodcity h3{margin:0;padding:14px 16px;font-family:var(--display);font-weight:800;font-size:20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.foodcity h3 .local{color:var(--gold);font-size:15px;font-weight:600;margin-left:6px}
.foodcity h3 small{font-family:var(--body);font-weight:700;font-size:12px;color:var(--muted)}
.food{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 16px;border-top:1px solid var(--line)}
.food:first-of-type{border-top:0}
.food .n{min-width:0}
.food .n small{display:block;color:var(--muted);font-size:13px}
a.map{flex:0 0 auto;font-size:13px;font-weight:700;color:var(--accent);text-decoration:none;background:var(--sunk);padding:5px 12px;border-radius:999px}

.card{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:12px}
.doc{display:grid;grid-template-columns:28px 1fr;gap:12px;align-items:start}
.doc .t{font-weight:700}
.doc .d{font-size:14px;color:var(--muted)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 8px;border-top:1px solid var(--line);vertical-align:top}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;border-top:0}
td.mono{white-space:nowrap}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:0;background:var(--lacquer);color:var(--on-lacquer);border-radius:12px;padding:10px 16px;font-weight:700;font-size:15px}
.btn.ghost{background:var(--sunk);color:var(--ink)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;font-weight:600;z-index:9;max-width:90vw;text-align:center}
@media (prefers-reduced-motion:no-preference){.view{animation:in .22s ease-out}@keyframes in{from{opacity:.5;transform:translateY(5px)}to{opacity:1;transform:none}}}
@media (max-width:380px){.pass .ap{font-size:26px}.dayhead .city{font-size:30px}}

const store={get(k,d){try{const v=localStorage.getItem(KEY+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(KEY+k,JSON.stringify(v))}catch(e){}}};

// ---------- Helpers ----------
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const DOW=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"],MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function fmtDate(iso){const d=new Date(iso+"T12:00:00Z");return `${DOW[d.getUTCDay()]} ${d.getUTCDate()} ${MON[d.getUTCMonth()]}`}
function tzLabel(o){return "UTC"+(o>=0?"+":"−")+Math.abs(o)}
function localNow(o){const d=new Date(Date.now()+o*3600e3);return{date:d.toISOString().slice(0,10),hm:d.toISOString().slice(11,16)}}
function mapUrl(q,cn){const e=encodeURIComponent(q);return cn?`https://maps.apple.com/?q=${e}`:`https://www.google.com/maps/search/?api=1&query=${e}`}
function confOf(ref){return ref&&S.book[ref]&&S.book[ref].conf?S.book[ref].conf:""}
function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,1600)}
const LOCAL={"Phuket":"ภูเก็ต","Bangkok":"กรุงเทพฯ","Hanoi":"Hà Nội","Hong Kong":"香港","Guangzhou":"广州","Beijing":"北京","Chongqing":"重庆"};
const CCNAME={TH:"Thailand",VN:"Vietnam",HK:"Hong Kong",CN:"China",US:"USA"};
let editing=null;
const KIND={flight:"Flight",train:"Train",taxi:"Car",hotel:"Hotel",act:"Plan",food:"Food"};
const CHECK='<svg viewBox="0 0 16 16"><path d="M3 8.5l3 3 7-7"/></svg>';

function currentDayIndex(){
  for(let i=0;i<DAYS.length;i++){if(localNow(DAYS[i].tz).date===DAYS[i].date)return i}
  const now=localNow(-5).date;
  if(now<DAYS[0].date)return -1;
  return DAYS.length; // finished
}
function itemRow(d,i,it){
  const id=d.date+"#"+i, done=!!S.done[id], ticket=["flight","train","taxi"].includes(it.k);
  const conf=confOf(it.ref);
  return `<div class="row${ticket?" ticket":""}${done?" done":""}">
   <div class="time">${esc(it.t||"·")}</div>
   <div class="body"><div class="kind">${KIND[it.k]}</div>
    <div class="title">${esc(it.title)}${it.fav?'<span class="fav" title="Favored">★</span>':""}${it.opt?'<span class="tag">optional</span>':""}</div>
    ${it.sub?`<div class="detail">${esc(it.sub)}</div>`:""}
    ${conf&&editing!==it.ref+"@"+id?`<div class="code">${esc(conf)}<button data-copy="${esc(conf)}">Copy</button><button data-edit="${it.ref}@${id}">Edit</button></div>`:""}
    ${it.ref&&!conf&&editing!==it.ref+"@"+id?`<button class="addcode" data-edit="${it.ref}@${id}">+ Add confirmation code</button>`:""}
    ${editing===it.ref+"@"+id?`<div class="inlinecode"><input type="text" id="ic-${id}" value="${esc(conf)}" placeholder="Confirmation code" autocomplete="off" autocapitalize="characters"><button data-savecode="${it.ref}" data-for="ic-${id}">Save</button></div>`:""}
   </div>
   <button class="check" aria-pressed="${done}" aria-label="Mark done" data-done="${id}">${CHECK}</button>
  </div>`;
}
function dayBlock(idx){
  const d=DAYS[idx];
  const unsched=d.unsched?`<div class="tl"><div class="subhead">Not scheduled · Beijing</div>${d.unsched.map(u=>`<div class="row"><div class="time">—</div><div class="body"><div class="title">${esc(u)}</div><div class="detail">Daytime site. Doesn't fit this stay.</div></div><span></span></div>`).join("")}</div>`:"";
  return `
   <div class="dayhead"><div><div class="eyebrow">Day ${idx+1} of ${DAYS.length}${d.dayTrip?" · "+esc(d.dayTrip):""}</div><div class="city">${esc(d.city)}${LOCAL[d.city]?`<span class="local">${LOCAL[d.city]}</span>`:""}</div><div class="date">${fmtDate(d.date)} 2026</div></div><span class="cc ${d.cc}"><i></i>${CCNAME[d.cc]?CCNAME[d.cc]+" · ":""}${tzLabel(d.tz)}</span></div>
   ${(d.alerts||[]).map(a=>`<div class="alert">${a}</div>`).join("")}
   ${d.note?`<div class="small muted">${esc(d.note)}</div>`:""}
   <div class="tl">${d.items.map((it,i)=>itemRow(d,i,it)).join("")}</div>
   ${unsched}
   <label class="fld" for="note-${d.date}">Notes for this day<textarea id="note-${d.date}" data-note="${d.date}" placeholder="Reservations, reminders, ideas">${esc(S.notes[d.date]||"")}</textarea></label>`;
}

    const nxt=DAYS[0].items[0];
    return `<div class="next"><div class="eyebrow">Trip starts in</div><div class="big">${days} day${days===1?"":"s"}</div>

  }
  if(ci===DAYS.length) return `<div class="next"><div class="eyebrow">Trip complete</div><div class="big">Welcome home</div></div>`;
  const d=DAYS[ci], now=localNow(d.tz).hm;

  return `${nx?`<div class="next"><div class="eyebrow">Next up · ${esc(d.city)} ${now} local</div><div class="big">${esc(nx.title)}</div>

   ${dayBlock(ci)}`;
}

  </tbody></table></div></div>
  <h2 class="sec">Apps to install</h2>
  <div class="card small"><div><b>Thailand and Vietnam:</b> Grab for rides and food.</div><div><b>Hong Kong:</b> Octopus card in Apple Wallet for MTR, trams, Peak Tram.</div><div><b>China:</b> Alipay, WeChat, DiDi (in English inside Alipay), Trip.com, and Apple Maps or Amap for directions.</div></div>
  <h2 class="sec">Share and backup</h2>
  <div class="card"><div class="small muted">Codes, notes and checkmarks are saved on this phone only. To give them to your wife, tap Copy codes and send her the text. She taps Restore and pastes it. Do the same after you add new codes.</div>
   <div class="btns"><button class="btn" data-act="export">Copy codes and notes</button><button class="btn ghost" data-act="showimport">Restore from pasted text</button></div>
   <div id="imp" hidden><label class="fld" for="impbox">Paste backup<textarea id="impbox"></textarea></label><div class="btns" style="margin-top:8px"><button class="btn" data-act="import">Restore</button></div></div>
   <textarea id="expbox" hidden readonly></textarea>
  </div>`;
}

function render(){
  const v={today:viewToday,days:viewDays,book:viewBook,food:viewFood,info:viewInfo}[tab]();
  $("#main").innerHTML=`<section class="view">${v}</section>`;
  document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-current",b.dataset.tab===tab?"page":"false"));
  const ci=currentDayIndex();
  $("#badge").textContent=ci<0?"Starts 2 Nov":ci>=DAYS.length?"Complete":`Day ${ci+1}/${DAYS.length}`;
  if(tab==="days"){const c=document.querySelector('.chip[aria-pressed="true"]');if(c)c.scrollIntoView({inline:"center",block:"nearest"})}
}
function go(t){tab=t;store.set("tab",t);render();window.scrollTo(0,0)}

document.addEventListener("click",e=>{
  const b=e.target.closest("button,[data-tab]"); if(!b)return;
  if(b.dataset.tab){go(b.dataset.tab);return}
  if(b.dataset.edit){editing=b.dataset.edit;render();const i=document.querySelector(".inlinecode input");if(i)i.focus();return}
  if(b.dataset.savecode){const r=b.dataset.savecode,v=$("#"+CSS.escape(b.dataset.for)).value.trim();S.book[r]=S.book[r]||{};S.book[r].conf=v;save("book");editing=null;render();toast(v?"Code saved":"Code removed");return}
  if(b.dataset.day){dayIdx=+b.dataset.day;render();return}
  if(b.dataset.seg){bookSeg=b.dataset.seg;store.set("seg",bookSeg);render();return}
  if(b.dataset.done){const id=b.dataset.done;S.done[id]=!S.done[id];if(!S.done[id])delete S.done[id];save("done");render();return}
  if(b.dataset.doc){const id=b.dataset.doc;S.docs[id]=!S.docs[id];save("docs");render();return}
  if(b.dataset.copy!==undefined){const txt=b.dataset.copy;
    navigator.clipboard?.writeText(txt).then(()=>toast("Copied "+txt)).catch(()=>toast(txt));return}
  if(b.dataset.act==="export"){const data=JSON.stringify({v:1,done:S.done,notes:S.notes,book:S.book,docs:S.docs});
    navigator.clipboard?.writeText(data).then(()=>toast("Copied. Paste it into a message to your wife.")).catch(()=>{const t=$("#expbox");t.hidden=false;t.value=data;t.select();toast("Select all and copy")});return}
  if(b.dataset.act==="showimport"){$("#imp").hidden=false;$("#impbox").focus();return}
  if(b.dataset.act==="import"){try{const d=JSON.parse($("#impbox").value);["done","notes","book","docs"].forEach(k=>{if(d[k]&&typeof d[k]==="object"){S[k]=d[k];save(k)}});toast("Backup restored");render()}catch(err){toast("That text isn't a valid backup. Copy it again and paste the whole thing.")}}
});
document.addEventListener("input",e=>{
  const el=e.target;
  if(el.dataset.note){S.notes[el.dataset.note]=el.value;save("notes")}
  if(el.dataset.book){const r=el.dataset.book;S.book[r]=S.book[r]||{};S.book[r][el.dataset.key]=el.value.trim();save("book")}
});
render();
setInterval(()=>{if(tab==="today"&&!document.activeElement.matches("input,textarea"))render()},60000);
if("serviceWorker" in navigator&&document.querySelector('link[rel="manifest"]')){navigator.serviceWorker.register("sw.js").catch(()=>{})}
</script>

</body></html>
